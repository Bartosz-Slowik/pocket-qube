[package]
name = "pocket-qube-skeleton"
version = "0.1.0"
edition = "2024"

[dependencies]
embassy-stm32 = { version = "0.5.0", features = [
  "defmt",
  "unstable-pac",
  "stm32u545re",
  "time-driver-any",
  "memory-x",
] }

embassy-time = { version = "0.5.0", features = [
  "defmt",
  "defmt-timestamp-uptime",
  "tick-hz-32_768",
] }

embassy-executor = { version = "0.9.1", features = [
  "arch-cortex-m",
  "executor-thread",
  "defmt",
] }

cortex-m-rt = "0.7.5"
cortex-m = { version = "0.7.7", features = [
  "inline-asm",
  "critical-section-single-core",
] }

embedded-test-linker-script = { version = "0.1.0" }

defmt = "1.0.1"
defmt-rtt = "1.0.0"
panic-probe = "1.0.0"


[dev-dependencies]
embedded-test = { version = "0.7.0", features = ["embassy", "defmt"] }

[[test]]
name = "example_test"
harness = false       # Important: As we bring our own test harness, we need to disable the default one

[[bin]]
name = "pocket-qube-skeleton"
test = false
bench = false

[profile.release]
debug = 2 # Without it defmt does not show source code locations
