[package]
name = "receiver"
version = "0.1.0"
edition = "2024"

[dependencies]
embassy-stm32 = { version = "0.5.0", features = [
  "defmt",
  "stm32f103c8",
  "unstable-pac",
  "time-driver-any",
  "memory-x",
  "exti",
] }
embassy-time = { version = "0.5.0", features = [
  "defmt",
  "defmt-timestamp-uptime",
  "tick-hz-32_768",
] }
embassy-executor = { version = "0.9.1", features = [
  "arch-cortex-m",
  "executor-thread",
  "defmt",
] }
cortex-m = { version = "0.7.7", features = [
  "inline-asm",
  "critical-section-single-core",
] }
cortex-m-rt = "0.7.5"
defmt = "1.0.1"
defmt-rtt = "1.0.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
heapless = "0.8.0"
embedded-hal = "1.0.0"
embassy-embedded-hal = "0.5.0"
lr2021 = { version = "0.13.1", features = ["defmt"] }

[profile.release]
debug = true
opt-level = "s"
